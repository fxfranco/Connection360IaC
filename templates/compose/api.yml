# ==================================================================================================
# Instancia API: Connection360.Api. Usa PostgreSQL, MongoDB (telemetria/observabilidad) y publica
# eventos en Kafka. Solo accesible desde el gateway (security group).
# ==================================================================================================
name: connection360-api

services:
  api-connection360:
    image: ${REGISTRY}/connection360.api:${API_VERSION}
    container_name: connection360_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      Logging__LogLevel__Default: ${LOG_LEVEL_DEFAULT}
      Logging__LogLevel__Microsoft.AspNetCore: Warning
      Observability__Enabled: ${OBSERVABILITY_ENABLED}
      Observability__Mongo__ConnectionString: ${MONGO_CONNECTION}
      Observability__Mongo__DatabaseName: ${MONGO_DATABASE}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Roles: ${JWT_ROLES}
      KafkaSettings__BootstrapServers: ${KAFKA_BOOTSTRAP_SERVERS}
      KafkaSettings__GroupId: ${KAFKA_GROUP_ID}
      KafkaSettings__Topic: ${KAFKA_TOPIC}
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__PostgresConnection: ${POSTGRES_CONNECTION}
      Auth0Management__Domain: ${AUTH0_DOMAIN}
      Auth0Management__ClientId: ${AUTH0_CLIENT_ID}
      Auth0Management__ClientSecret: ${AUTH0_CLIENT_SECRET}
      OutboxPublisher__PollingIntervalSeconds: ${OUTBOX_POLLING_INTERVAL_SECONDS}
      # Sincronizacion de usuarios de Auth0 hacia Notification (topico USER_SYNC_TOPIC -> coleccion basicUserData).
      Auth0UserSync__Enabled: ${USER_SYNC_ENABLED}
      Auth0UserSync__Topic: ${USER_SYNC_TOPIC}
      Auth0UserSync__PollingIntervalMinutes: ${USER_SYNC_INTERVAL_MINUTES}
      Auth0UserSync__BatchSize: ${USER_SYNC_BATCH_SIZE}
      Auth0UserSync__StartupRetryDelaySeconds: ${USER_SYNC_STARTUP_RETRY_SECONDS}
      ExternalApi__Apis__OPENSTREETMAP__BaseUrl: ${OPENSTREETMAP_BASE_URL}
      ExternalApi__Apis__OPENSTREETMAP__DataEndpoint: /search?q=
      ExternalApi__Apis__OPENSTREETMAP__ApiKey: ${OPENSTREETMAP_API_KEY}
      ExternalApi__Apis__OPENSTREETMAP__TimeoutSeconds: ${EXTERNAL_API_TIMEOUT_SECONDS}
      # Cache en memoria de coordenadas (OpenStreetMap) del detalle de envios, con tope de memoria.
      CoordinatesCache__Enabled: ${COORDINATES_CACHE_ENABLED}
      CoordinatesCache__MaxSizeBytes: ${COORDINATES_CACHE_MAX_SIZE_BYTES}
      CoordinatesCache__EvictionPercentage: ${COORDINATES_CACHE_EVICTION_PERCENTAGE}
      CoordinatesCache__AbsoluteExpiration: ${COORDINATES_CACHE_ABSOLUTE_EXPIRATION}
      CoordinatesCache__SlidingExpiration: ${COORDINATES_CACHE_SLIDING_EXPIRATION}
      CoordinatesCache__MaxKeyLength: ${COORDINATES_CACHE_MAX_KEY_LENGTH}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
